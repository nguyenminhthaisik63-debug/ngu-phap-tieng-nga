<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Ngữ pháp tiếng Nga · Ментальные карты (Tablet & Stylus)</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#4f46e5">
<meta name="mobile-web-app-capable" content="yes">

<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1f2430;--mut:#6b7280;--bd:#dfe3ee;--pri:#4f46e5}
@media(prefers-color-scheme:dark){:root{--bg:#14161c;--card:#1d2029;--tx:#e8eaf0;--mut:#9aa1b2;--bd:#2d3140;--pri:#6366f1}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:15px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--tx);display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
header{padding:8px 12px;display:flex;gap:8px;align-items:center;background:var(--card);border-bottom:1px solid var(--bd);overflow-x:auto;white-space:nowrap;scrollbar-width:none}
header::-webkit-scrollbar{display:none}
header>*{flex:none}
h1{font-size:16px;margin:0 6px 0 0}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;min-height:38px}
button,select{cursor:pointer;touch-action:manipulation}
button:hover,button:active{border-color:var(--pri)}
button.primary{background:var(--pri);color:#fff;border-color:var(--pri)}
main{flex:1;display:flex;min-height:0;position:relative}
#map{flex:1;overflow:auto;touch-action:none;cursor:grab;position:relative;user-select:none}
#map:active{cursor:grabbing}
#panel{width:440px;padding:16px;background:var(--card);border-left:1px solid var(--bd);overflow-y:auto;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
#panel label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:12px 0 4px}
#panel input,#panel textarea{width:100%;font-size:16px}
#panel textarea{resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.row button{flex:1;min-width:110px}
.hint{color:var(--mut);font-size:13px}
svg text{pointer-events:none}
.nd{cursor:pointer}
#panel .close{float:right;padding:6px 12px;min-height:34px}
.zoom{display:flex;gap:4px}
.zoom button{min-width:38px;padding:6px}

/* Thanh công cụ nổi cho bút & cảm ứng */
#fab{position:fixed;bottom:20px;left:20px;z-index:20;display:none;gap:8px;background:var(--card);padding:8px;border-radius:14px;border:1px solid var(--bd);box-shadow:0 8px 24px rgba(0,0,0,.15)}
#fab.show{display:flex;flex-wrap:wrap}
#fab button{padding:8px 12px;font-size:14px;font-weight:500}

/* Khu vực bảng vẽ viết tay (Stylus Canvas) */
.sketch-wrap{margin-top:8px;border:1.5px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column}
.sketch-wrap.fullscreen{position:fixed;inset:12px;z-index:100;margin:0;border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.45)}
.sketch-bar{display:flex;gap:6px;padding:8px;background:var(--card);border-bottom:1px solid var(--bd);align-items:center;flex-wrap:wrap}
.swatch{width:28px;height:28px;min-height:28px;border-radius:50%;padding:0;border:2px solid transparent}
.swatch.active{border-color:var(--tx);transform:scale(1.12)}
.sketch-bar button.tool{padding:5px 10px;min-height:32px;font-size:13px}
.sketch-bar button.tool.active{background:var(--pri);color:#fff;border-color:var(--pri)}
#pad{display:block;width:100%;height:300px;touch-action:none;cursor:crosshair;background-image:radial-gradient(var(--bd) 1px,transparent 1px);background-size:18px 18px}
.sketch-wrap.fullscreen #pad{flex:1;height:auto}
.sketch-resize{height:18px;background:var(--card);border-top:1px solid var(--bd);display:flex;align-items:center;justify-content:center;cursor:ns-resize;touch-action:none;color:var(--mut);font-size:12px;user-select:none}
.sketch-wrap.fullscreen .sketch-resize{display:none}

/* Chế độ xoay dọc / màn hình nhỏ trên Tablet */
@media(max-width:900px){
  main{flex-direction:column}
  #panel{width:100%;height:56%;border-left:0;border-top:1px solid var(--bd)}
  #panel.empty{display:none}
  #fab{bottom:calc(56% + 12px);left:12px;right:12px;justify-content:center}
  #fab.no-panel{bottom:16px}
}
</style>
</head>
<body>
<header>
  <h1>🧠 Sơ đồ tư duy · Ментальные карты</h1>
  <select id="sel"></select>
  <button id="addMap">+ Sơ đồ mới</button>
  <button id="delMap">Xóa sơ đồ</button>
  <label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" id="hideV" style="width:18px;height:18px;min-height:auto"> Ẩn tiếng Việt</label>
  <span class="zoom"><button id="zo" title="Thu nhỏ">−</button><button id="zReset" title="100%">100%</button><button id="zi" title="Phóng to">+</button></span>
  <button id="exp">Xuất JSON</button>
  <button id="imp">Nhập JSON</button>
  <button id="reset">Mặc định</button>
  <button id="login">Đăng nhập Google</button>
  <span id="syncStat" class="hint"></span>
  <input type="file" id="file" accept=".json" hidden>
</header>
<main>
  <div id="map"></div>
  <div id="fab">
    <button id="fab_add" class="primary">+ Nhánh con</button>
    <button id="fab_draw">✍️ Viết tay</button>
    <button id="fab_tg">Thu gọn / Mở</button>
    <button id="fab_del">Xóa</button>
  </div>
  <div id="panel" class="empty"></div>
</main>
<script>
const KEY='ru-grammar-maps-v1';
const N=(t,v,n,e,c,img)=>({t,v:v||'',n:n||'',e:e||[],c:c||[],img:img||''});

const DEFAULT=[
N('Падежи','6 cách (格)','Русский язык: 6 падежей. Danh từ, tính từ, đại từ biến đổi theo cách.',[],[
  N('Именительный','Cách 1 · Кто? Что?','Chủ ngữ, từ điển hình. Dạng gốc của từ.',['Студент читает книгу.'],[
    N('Окончания','Đuôi','-, -а/-я, -о/-е, -ь; số nhiều: -ы/-и, -а/-я',['стол, книга, окно; столы, книги, окна'])]),
  N('Родительный','Cách 2 · Кого? Чего?','Dùng để chỉ sở hữu, phủ định, số lượng, và sau nhiều giới từ.',['У меня нет времени.'],[
    N('Sở hữu','Принадлежность','Danh từ 2 đứng sau danh từ 1.',['книга брата']),
    N('Phủ định','Отрицание','нет, не было, не будет + Р.п.',['В городе нет метро.']),
    N('Số lượng','Количество','много, мало, несколько, бутылка, 5+ + Р.п.',['много друзей, пять книг']),
    N('Giới từ','Предлоги','у, из, от, до, без, для, около, после, с (từ)',['Я иду из университета.']),
    N('Окончания','Đuôi','-а/-я; -ы/-и (nữ); số nhiều: -ов/-ев, -ей, (không đuôi)',['стола, книги, окна; столов, книг'])]),
  N('Дательный','Cách 3 · Кому? Чему?','Người nhận hành động, trạng thái, tuổi, giới từ к, по.',['Я дал книгу другу.'],[
    N('Người nhận','Адресат','давать, писать, звонить, помогать + Д.п.',['Я звоню маме.']),
    N('Cảm giác/Cần','Состояние','Мне нравится / нужно / холодно / интересно',['Мне нужно учиться.']),
    N('Tuổi','Возраст','Мне 19 лет.',['Брату 20 лет.']),
    N('Giới từ','Предлоги','к (đến), по (theo, dọc), благодаря',['Я иду к врачу.']),
    N('Окончания','Đuôi','-у/-ю; -е/-и (nữ); số nhiều: -ам/-ям',['столу, книге, окну; столам'])]),
  N('Винительный','Cách 4 · Кого? Что?','Tân ngữ trực tiếp, hướng đi (Куда?), thời gian.',['Я читаю книгу.'],[
    N('Tân ngữ','Прямое дополнение','Động từ ngoại động: читать, видеть, любить',['Я вижу брата.']),
    N('Куда?','Направление','в, на + В.п. (đi tới đâu)',['Я иду в школу.']),
    N('Thời gian','Время','в среду, в субботу, через час, за неделю',['Я приду в среду.']),
    N('Окончания','Đuôi','Giống đực có sinh: = Р.п.; nữ: -у/-ю; trung = И.п.',['брата, книгу, окно'])]),
  N('Творительный','Cách 5 · Кем? Чем?','Công cụ, cùng với ai, vị ngữ, giới từ chỉ vị trí.',['Я пишу ручкой.'],[
    N('Công cụ','Орудие','Làm bằng cái gì',['резать ножом']),
    N('С + Т.п.','Совместность','с (cùng với)',['Я гуляю с другом.']),
    N('Быть/Стать','Связка','быть, стать, работать + Т.п.',['Он хочет стать врачом.']),
    N('Giới từ','Предлоги','над, под, перед, за, между, рядом с',['Книга лежит под столом.']),
    N('Окончания','Đuôi','-ом/-ем; -ой/-ей (nữ); số nhiều: -ами/-ями',['столом, книгой, окном'])]),
  N('Предложный','Cách 6 · О ком? О чём? Где?','Chỉ dùng với giới từ: о, в, на, при.',['Я живу в Москве.'],[
    N('О + П.п.','Тема','Nói/nghĩ về',['Мы говорим о фильме.']),
    N('Где?','Место','в, на + П.п. (ở đâu)',['Книга лежит на столе.']),
    N('Окончания','Đuôi','-е; -и (-ия, -ие, -ь nữ); số nhiều: -ах/-ях',['о столе, в школе, в здании'])])
]),
N('Вид глагола','Thể động từ','Mỗi động từ có thường là một cặp: НСВ và СВ.',[],[
  N('НСВ','Chưa hoàn thành · Что делать?','Nhấn mạnh quá trình, sự lặp lại, sự việc nói chung.',['Я читал книгу весь вечер.'],[
    N('Từ nhận biết','Маркеры','всегда, часто, каждый день, обычно, долго, весь день',['Я каждый день читаю.']),
    N('Thì','Времена','Có đủ 3 thì: читал / читаю / буду читать',[])]),
  N('СВ','Hoàn thành · Что сделать?','Nhấn mạnh kết quả, một lần, đã xong.',['Я прочитал книгу.'],[
    N('Từ nhận biết','Маркеры','вдруг, уже, наконец, за час, сразу',['Я прочитал за два часа.']),
    N('Thì','Времена','Chỉ có quá khứ và tương lai đơn: прочитал / прочитаю (không có hiện tại)',[])]),
  N('Tạo cặp','Образование пар','Ba cách thành lập cặp thể.',[],[
    N('Tiền tố','Приставка','писать → написать; делать → сделать',[]),
    N('Hậu tố','Суффикс','решить → решать; рассказать → рассказывать',[]),
    N('Khác gốc','Разные корни','брать → взять; говорить → сказать; класть → положить',[])])
]),
N('Глаголы движения','Động từ chuyển động','Chia thành 2 nhóm: định hướng và không định hướng.',[],[
  N('Định hướng','Однонаправленные','Đi 1 chiều, đang đi, một lần.',['Я иду в университет.'],[
    N('Danh sách','Список','идти, ехать, бежать, лететь, плыть, нести, вести, везти',[])]),
  N('Không định hướng','Неоднонаправленные','Đi lại nhiều lần, thói quen, khả năng, đi khứ hồi.',['Я часто хожу в библиотеку.'],[
    N('Danh sách','Список','ходить, ездить, бегать, летать, плавать, носить, водить, возить',[])]),
  N('Tiền tố','Приставки','Khi thêm tiền tố, cặp trở thành cặp thể (идти → прийти).',[],[
    N('при-','đến','приехать, прийти',['Я приехал в Москву.']),
    N('у-','rời đi','уйти, уехать',['Он ушёл домой.']),
    N('в- / вы-','vào / ra','войти, выйти',['Она вышла из комнаты.']),
    N('пере- / под-','qua / lại gần','перейти, подойти',['Я перешёл улицу.'])])
])
];

function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(s)&&s.length)return s}catch(e){}return JSON.parse(JSON.stringify(DEFAULT))}
function save(){try{localStorage.setItem(KEY,JSON.stringify(maps))}catch(e){}}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cut=(s,n)=>s.length>n?s.slice(0,n-1)+'…':s;

let maps=load(),cur=0,sel=null,NODES=[];
let zoom=innerWidth<900?.85:1;
const W=200,H=52,GX=265,GY=66;
const $=id=>document.getElementById(id);

function updZoomLabel(){$('zReset').textContent=Math.round(zoom*100)+'%'}

function render(){
  const root=maps[cur];let row=0,maxD=0;NODES=[];
  function walk(n,d,hue,p){
    maxD=Math.max(maxD,d);
    const kids=n.x?[]:n.c;let y;
    if(!kids.length)y=row++;
    else{const ys=kids.map((k,i)=>walk(k,d+1,d==0?(i*67+200)%360:hue,n));y=(ys[0]+ys[ys.length-1])/2}
    NODES.push({n,d,y,hue,p});return y;
  }
  walk(root,0,220,null);
  const pos=new Map(NODES.map(o=>[o.n,o]));
  const hideV=$('hideV').checked;
  let links='',nodes='';
  NODES.forEach((o,i)=>{
    const x=o.d*GX+24,y=o.y*GY+24;
    if(o.p){
      const q=pos.get(o.p),x0=q.d*GX+24+W,y0=q.y*GY+24+H/2,x1=x,y1=y+H/2,m=(x0+x1)/2;
      links+=`<path d="M${x0} ${y0}C${m} ${y0} ${m} ${y1} ${x1} ${y1}" fill="none" stroke="hsl(${o.hue} 55% 55%)" stroke-width="2.2"/>`;
    }
    const isRoot=!o.p,s=o.n===sel;
    const fill=isRoot?'var(--pri)':`hsl(${o.hue} 60% 50% / .18)`;
    const stroke=isRoot?'var(--pri)':`hsl(${o.hue} 60% 50%)`;
    const col=isRoot?'#fff':'var(--tx)';
    const hasSketch=o.n.img?' ✍️':'';
    nodes+=`<g class="nd" data-i="${i}" transform="translate(${x} ${y})">
      <rect width="${W}" height="${H}" rx="12" fill="${fill}" stroke="${stroke}" stroke-width="${s?4:1.6}"/>
      <text x="12" y="${hideV||!o.n.v?31:21}" font-size="14.5" font-weight="600" fill="${col}">${esc(cut(o.n.t,23))+hasSketch}</text>
      ${hideV||!o.n.v?'':`<text x="12" y="40" font-size="11.5" fill="${col}" opacity=".78">${esc(cut(o.n.v,29))}</text>`}
      ${o.n.c.length?`<g data-tg="${i}"><circle cx="${W}" cy="${H/2}" r="22" fill="transparent"/><circle cx="${W}" cy="${H/2}" r="12" fill="var(--card)" stroke="${stroke}" stroke-width="1.8"/><text x="${W}" y="${H/2+5}" text-anchor="middle" font-size="15" font-weight="bold" fill="var(--tx)">${o.n.x?'+':'−'}</text></g>`:''}
    </g>`;
  });
  const w=(maxD+1)*GX+80,h=row*GY+60;
  $('map').innerHTML=`<svg width="${w*zoom}" height="${h*zoom}" viewBox="0 0 ${w} ${h}">${links}${nodes}</svg>`;
  updZoomLabel();
  updFab();
}

function updFab(){
  const fab=$('fab');
  if(!sel){fab.classList.remove('show');return}
  fab.classList.add('show');
  fab.classList.toggle('no-panel',$('panel').classList.contains('empty'));
  $('fab_del').style.display=(maps[cur]===sel)?'none':'inline-block';
  $('fab_tg').style.display=sel.c.length?'inline-block':'none';
}

/* ===== Logic Bảng Vẽ Viết Tay (S Pen / Stylus) ===== */
let undoStack=[];
function initSketchPad(){
  const wrap=$('sketchWrap');
  const cv=$('pad');
  if(!cv)return;
  const ctx=cv.getContext('2d');
  const dpr=window.devicePixelRatio||1;

  const isDark=matchMedia('(prefers-color-scheme:dark)').matches;
  let penColor=isDark?'#e8eaf0':'#1f2430';
  let penWidth=2.5;
  let isEraser=false;
  let drawing=false;
  let penOnly=false;
  undoStack=[];

  $('sw_auto').style.background=penColor;

  function resizeCanvas(preserveDataUrl){
    const rect=cv.getBoundingClientRect();
    if(!rect.width||!rect.height)return;
    cv.width=rect.width*dpr;
    cv.height=rect.height*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.lineCap='round';
    ctx.lineJoin='round';
    if(preserveDataUrl){
      const im=new Image();
      im.onload=()=>ctx.drawImage(im,0,0,im.width/dpr,im.height/dpr);
      im.src=preserveDataUrl;
    }
  }

  resizeCanvas(sel.img||'');

  function snapshot(){
    undoStack.push(cv.toDataURL('image/png'));
    if(undoStack.length>15)undoStack.shift();
  }

  function commitImg(){
    const blank=document.createElement('canvas');
    blank.width=cv.width;blank.height=cv.height;
    sel.img=(cv.toDataURL()===blank.toDataURL())?'':cv.toDataURL('image/png');
    save();
    render();
  }

  function getPos(e){
    const r=cv.getBoundingClientRect();
    return {x:e.clientX-r.left,y:e.clientY-r.top,p:e.pressure||0.5};
  }

  cv.onpointerdown=e=>{
    if(penOnly && e.pointerType!=='pen')return;
    e.preventDefault();
    cv.setPointerCapture(e.pointerId);
    snapshot();
    drawing=true;
    const pt=getPos(e);
    ctx.beginPath();
    ctx.moveTo(pt.x,pt.y);
  };

  cv.onpointermove=e=>{
    if(!drawing)return;
    if(penOnly && e.pointerType!=='pen')return;
    e.preventDefault();
    const pt=getPos(e);
    ctx.globalCompositeOperation=isEraser?'destination-out':'source-over';
    ctx.strokeStyle=penColor;
    const pressureFactor=(e.pointerType==='pen'&&e.pressure>0)?(0.6+e.pressure*0.9):1;
    ctx.lineWidth=(isEraser?18:penWidth)*pressureFactor;
    ctx.lineTo(pt.x,pt.y);
    ctx.stroke();
  };

  const endStroke=()=>{
    if(!drawing)return;
    drawing=false;
    ctx.closePath();
    commitImg();
  };
  cv.onpointerup=endStroke;
  cv.onpointercancel=endStroke;

  document.querySelectorAll('.swatch').forEach(btn=>{
    btn.onclick=()=>{
      isEraser=false;
      $('t_erase').classList.remove('active');
      document.querySelectorAll('.swatch').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      penColor=btn.dataset.c==='auto'?(isDark?'#e8eaf0':'#1f2430'):btn.dataset.c;
    };
  });

  $('t_erase').onclick=()=>{
    isEraser=!isEraser;
    $('t_erase').classList.toggle('active',isEraser);
  };

  $('t_penonly').onclick=()=>{
    penOnly=!penOnly;
    $('t_penonly').classList.toggle('active',penOnly);
    $('t_penonly').textContent=penOnly?'✒️ Chỉ bút: BẬT':'✒️ Chỉ bút: TẮT';
  };

  $('t_full').onclick=()=>{
    const data=cv.toDataURL('image/png');
    const isFull=wrap.classList.toggle('fullscreen');
    $('t_full').classList.toggle('active',isFull);
    $('t_full').textContent=isFull?'🗗 Thu nhỏ':'⛶ Phóng to';
    requestAnimationFrame(()=>resizeCanvas(sel.img?data:''));
  };

  const resizer=$('sketchResize');
  let resizing=false,startY=0,startH=0,savedData='';
  resizer.onpointerdown=e=>{
    e.preventDefault();
    resizer.setPointerCapture(e.pointerId);
    resizing=true;
    startY=e.clientY;
    startH=cv.getBoundingClientRect().height;
    savedData=sel.img?cv.toDataURL('image/png'):'';
  };
  resizer.onpointermove=e=>{
    if(!resizing)return;
    const newH=Math.max(180,Math.min(700,startH+(e.clientY-startY)));
    cv.style.height=newH+'px';
    resizeCanvas(savedData);
  };
  resizer.onpointerup=()=>{if(resizing){resizing=false;commitImg()}};
  resizer.onpointercancel=()=>{if(resizing){resizing=false;commitImg()}};

  $('t_undo').onclick=()=>{
    if(!undoStack.length)return;
    const prev=undoStack.pop();
    const rect=cv.getBoundingClientRect();
    ctx.globalCompositeOperation='source-over';
    ctx.clearRect(0,0,rect.width,rect.height);
    const im=new Image();
    im.onload=()=>{ctx.drawImage(im,0,0,im.width/dpr,im.height/dpr);commitImg()};
    im.src=prev;
  };

  $('t_clear').onclick=()=>{
    if(!confirm('Xóa toàn bộ nét viết tay của nhánh này?'))return;
    snapshot();
    const rect=cv.getBoundingClientRect();
    ctx.globalCompositeOperation='source-over';
    ctx.clearRect(0,0,rect.width,rect.height);
    commitImg();
  };
}

function panel(){
  const p=$('panel');
  p.classList.toggle('empty',!sel);
  updFab();

  const isRoot=maps[cur]===sel;
  p.innerHTML=`
  <button class="close" id="b_x">✕ Đóng</button>
  <label>Tiêu đề / Заголовок (tiếng Nga)</label><input id="f_t" enterkeyhint="next" value="${esc(sel.t)}">
  <label>Nghĩa tiếng Việt / По-вьетнамски</label><input id="f_v" enterkeyhint="next" value="${esc(sel.v)}">
  <label>✍️ Ghi chú viết tay (S Pen / Stylus)</label>
  <div class="sketch-wrap" id="sketchWrap">
    <div class="sketch-bar">

      <button class="swatch" data-c="#ef4444" style="background:#ef4444" title="Đỏ"></button>
      <button class="swatch" data-c="#2563eb" style="background:#2563eb" title="Xanh dương"></button>
      <button class="swatch" data-c="#16a34a" style="background:#16a34a" title="Xanh lá"></button>
      <button class="tool" id="t_erase">Tẩy</button>
      <button class="tool" id="t_undo">Hoàn tác</button>
      <button class="tool" id="t_clear">Xóa</button>
      <button class="tool" id="t_penonly" title="Chống chạm nhầm lòng bàn tay">✒️ Chỉ bút: TẮT</button>
      <button class="tool" id="t_full" title="Mở rộng toàn màn hình">⛶ Phóng to</button>
    </div>
    <canvas id="pad"></canvas>
    <div class="sketch-resize" id="sketchResize">⋯ Kéo xuống để mở rộng khung viết ⋯</div>
  </div>
  <label>Giải thích / Объяснение</label><textarea id="f_n" rows="3">${esc(sel.n)}</textarea>
  <label>Ví dụ (mỗi dòng một câu) / Примеры</label><textarea id="f_e" rows="3">${esc(sel.e.join('\n'))}</textarea>
  <div class="row">
    <button id="b_add" class="primary">+ Nhánh con</button>
    ${sel.c.length?'<button id="b_tg">Thu gọn / Mở</button>':''}
    ${isRoot?'':'<button id="b_del">Xóa nhánh</button>'}
  </div>`;

  $('b_x').onclick=()=>{sel=null;render();panel()};
  [['t','t'],['v','v'],['n','n']].forEach(([id,k])=>$('f_'+id).oninput=e=>{sel[k]=e.target.value;save();render()});
  $('f_e').oninput=e=>{sel.e=e.target.value.split('\n');save()};
  $('b_add').onclick=()=>{const k=N('Новый','Mới');sel.c.push(k);sel.x=0;sel=k;save();render();panel()};
  if($('b_del'))$('b_del').onclick=()=>{
    const o=NODES.find(o=>o.n===sel);o.p.c.splice(o.p.c.indexOf(sel),1);sel=o.p;save();render();panel()};
  if($('b_tg'))$('b_tg').onclick=()=>{sel.x=sel.x?0:1;save();render()};

  initSketchPad();
}

/* ===== Kéo thả sơ đồ (Pan) & Chụm 2 ngón phóng to/thu nhỏ (Pinch-to-Zoom) ===== */
const mapEl=$('map');
let pointers=new Map(),prevDist=0,isPanning=false,panMoved=false,startX=0,startY=0,scrollL=0,scrollT=0;

mapEl.onpointerdown=e=>{
  pointers.set(e.pointerId,e);
  if(pointers.size===1){
    isPanning=true;panMoved=false;
    startX=e.clientX;startY=e.clientY;
    scrollL=mapEl.scrollLeft;scrollT=mapEl.scrollTop;
  }else if(pointers.size===2){
    isPanning=false;
    const pts=[...pointers.values()];
    prevDist=Math.hypot(pts[0].clientX-pts[1].clientX,pts[0].clientY-pts[1].clientY);
  }
};

mapEl.onpointermove=e=>{
  if(!pointers.has(e.pointerId))return;
  pointers.set(e.pointerId,e);
  if(pointers.size===1 && isPanning){
    const dx=e.clientX-startX,dy=e.clientY-startY;
    if(Math.abs(dx)>6||Math.abs(dy)>6)panMoved=true;
    if(panMoved){
      mapEl.scrollLeft=scrollL-dx;
      mapEl.scrollTop=scrollT-dy;
    }
  }else if(pointers.size===2){
    panMoved=true;
    const pts=[...pointers.values()];
    const dist=Math.hypot(pts[0].clientX-pts[1].clientX,pts[0].clientY-pts[1].clientY);
    if(prevDist>0){
      const delta=(dist-prevDist)*0.004;
      const nextZoom=Math.min(2.2,Math.max(0.4,zoom+delta));
      if(Math.abs(nextZoom-zoom)>0.01){zoom=nextZoom;render()}
    }
    prevDist=dist;
  }
};

const clearPointer=e=>{
  pointers.delete(e.pointerId);
  if(pointers.size<2)prevDist=0;
  if(pointers.size===0)isPanning=false;
};
mapEl.onpointerup=clearPointer;
mapEl.onpointercancel=clearPointer;

mapEl.onclick=e=>{
  if(panMoved){panMoved=false;return}
  const tg=e.target.closest('[data-tg]');
  if(tg){const n=NODES[tg.dataset.tg].n;n.x=n.x?0:1;save();render();return}
  const g=e.target.closest('.nd');
  if(g){sel=NODES[g.dataset.i].n;render();panel()}
};

/* Kết nối thanh công cụ nổi (FAB) */
$('fab_add').onclick=()=>{if(!sel)return;const k=N('Новый','Mới');sel.c.push(k);sel.x=0;sel=k;save();render();panel()};
$('fab_draw').onclick=()=>{
  if(!sel)return;
  if($('panel').classList.contains('empty'))panel();
  const cv=$('pad');
  if(cv)cv.scrollIntoView({behavior:'smooth',block:'center'});
};
$('fab_tg').onclick=()=>{if(!sel||!sel.c.length)return;sel.x=sel.x?0:1;save();render()};
$('fab_del').onclick=()=>{
  if(!sel||maps[cur]===sel)return;
  const o=NODES.find(o=>o.n===sel);o.p.c.splice(o.p.c.indexOf(sel),1);sel=o.p;save();render();panel();
};

function fillSel(){$('sel').innerHTML=maps.map((m,i)=>`<option value="${i}">${esc(m.t)}</option>`).join('');$('sel').value=cur}
function refresh(){fillSel();sel=null;render();panel()}
$('sel').onchange=e=>{cur=+e.target.value;sel=null;render();panel()};
$('hideV').onchange=render;
$('addMap').onclick=()=>{const t=prompt('Tên sơ đồ / Название:');if(!t)return;maps.push(N(t));cur=maps.length-1;save();refresh();sel=maps[cur];render();panel()};
$('delMap').onclick=()=>{if(maps.length<2)return alert('Cần giữ ít nhất 1 sơ đồ.');if(!confirm('Xóa sơ đồ "'+maps[cur].t+'"?'))return;maps.splice(cur,1);cur=0;save();refresh()};
$('reset').onclick=()=>{if(!confirm('Đặt lại về nội dung mặc định? Mọi chỉnh sửa sẽ mất.'))return;maps=JSON.parse(JSON.stringify(DEFAULT));cur=0;save();refresh()};
$('exp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(maps,null,1)],{type:'application/json'}));a.download='ngu-phap-nga.json';a.click()};
$('imp').onclick=()=>$('file').click();
$('file').onchange=e=>{
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d)||!d.length)throw 0;maps=d;cur=0;save();refresh()}catch(x){alert('File JSON không hợp lệ.')}};
  r.readAsText(f);e.target.value='';
};
$('zi').onclick=()=>{zoom=Math.min(2.2,zoom+.2);render()};
$('zo').onclick=()=>{zoom=Math.max(.4,zoom-.2);render()};
$('zReset').onclick=()=>{zoom=1;render()};

/* ===== Ôn tập ngắt quãng / Интервальное повторение (Chỉ các ô có nét vẽ) ===== */
const INT=[0,1,3,7,14,30,60,120],DROP=2,BATCH=20,DAY=864e5;
const LAB=['Chưa ôn','1 ngày','3 ngày','7 ngày','14 ngày','30 ngày','60 ngày','120 ngày'];
let Q=[],total=0,done=0,shown=false,mode='';
const rvStyle=document.createElement('style');
rvStyle.textContent=`
#rv{position:fixed;inset:0;background:rgba(15,16,25,.78);z-index:50;display:flex;align-items:center;justify-content:center;padding:12px}
#rv .box{background:var(--card);border:1px solid var(--bd);border-radius:16px;width:min(580px,100%);max-height:100%;overflow:auto;padding:22px}
#rv h2{margin:6px 0;font-size:26px}
#rv .cap{color:var(--mut);font-size:13px}
#rv .btns{display:flex;gap:10px;margin-top:14px}
#rv .btns button{flex:1;padding:14px;font-size:16px}
#rv .ok{border-color:#16a34a;color:#16a34a}
#rv .no{border-color:#dc2626;color:#dc2626}
#rv .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin:12px 0}
#rv .grid div{border:1px solid var(--bd);border-radius:10px;padding:8px;font-size:13px}
#rv .grid b{display:block;font-size:18px}
#rv .ans{margin-top:14px;padding-top:12px;border-top:1px solid var(--bd)}
#rv .ans p{margin:6px 0}
#rv .ans img{max-width:100%;border:1px solid var(--bd);border-radius:10px;margin-top:8px;background:var(--bg)}`;
document.head.appendChild(rvStyle);

const isDue=n=>!n.s||n.s.d<=Date.now();
const boxOf=n=>(n.s&&n.s.b)||0;
function cards(){
  const out=[];
  function walkCards(node,path,mapTitle){
    if(node.img){
      out.push({n:node,path:[...path,node.t],map:mapTitle});
    }
    (node.c||[]).forEach(ch=>walkCards(ch,[...path,node.t],mapTitle));
  }
  maps.forEach(m=>walkCards(m,[],m.t));
  return out;
}
const rb=document.createElement('button');rb.id='rvBtn';
document.querySelector('header').appendChild(rb);
function updBtn(){rb.textContent='🔁 Ôn nét vẽ ('+cards().filter(c=>isDue(c.n)).length+')'}
const _render=window.render;
window.render=function(){_render();updBtn()};

function rvEl(){
  let e=$('rv');
  if(!e){e=document.createElement('div');e.id='rv';document.body.appendChild(e);e.onclick=rvClick}
  return e;
}
function rvClose(){const e=$('rv');if(e)e.remove();mode='';updBtn()}
function rvHome(){
  mode='home';
  const all=cards(),due=all.filter(c=>isDue(c.n)),cnt=Array(8).fill(0);
  all.forEach(c=>cnt[boxOf(c.n)]++);
  rvEl().innerHTML=`<div class="box"><h2>🔁 Ôn tập nét vẽ tay</h2><div class="cap">Повторение заметок от руки</div>
  <div class="grid">${cnt.map((x,i)=>`<div>${LAB[i]}<b>${x}</b></div>`).join('')}</div>
  <p>Đến hạn: <b>${due.length}</b> / ${all.length} ô có nét vẽ</p>
  <div class="btns"><button data-a="close">Đóng</button>${due.length?`<button class="ok" data-a="start">Bắt đầu (${Math.min(due.length,BATCH)})</button>`:''}</div></div>`;
}
function rvStart(){
  const key=c=>c.n.s?c.n.s.d:9e15;
  Q=cards().filter(c=>isDue(c.n)).sort((a,b)=>key(a)-key(b)).slice(0,BATCH);
  total=Q.length;done=0;shown=false;rvCard();
}
function rvCard(){
  if(!Q.length)return rvEnd();
  mode='card';
  const c=Q[0],n=c.n,ctx=[c.map].concat(c.path.slice(1,-1)).join(' › ');
  rvEl().innerHTML=`<div class="box">
  <div class="cap">Đã nhớ ${done}/${total} · còn ${Q.length} ô · nhóm: ${LAB[boxOf(n)]}</div>
  <div class="cap">${esc(ctx)}</div><h2>${esc(n.t)}</h2>
  ${shown?`<div class="ans"><img src="${n.img}" alt="Ghi chú viết tay">${n.v?`<p><b>${esc(n.v)}</b></p>`:''}${n.n?`<p>${esc(n.n)}</p>`:''}${(n.e||[]).filter(Boolean).map(x=>`<p><i>${esc(x)}</i></p>`).join('')}</div>
  <div class="btns"><button class="no" data-a="no">✗ Không nhớ</button><button class="ok" data-a="yes">✓ Nhớ</button></div>`
  :`<div class="btns"><button data-a="show">Hiện nét vẽ & đáp án</button></div>`}
  <div class="btns"><button data-a="close">Thoát</button></div></div>`;
}
function rvEnd(){
  mode='end';
  const due=cards().filter(c=>isDue(c.n)).length;
  rvEl().innerHTML=`<div class="box"><h2>🎉 Xong phiên ôn tập</h2><div class="cap">Сессия завершена</div>
  <p>Đã nhớ ${done} ô có nét vẽ. Còn ${due} ô đến hạn.</p>
  <div class="btns"><button data-a="close">Trở về sơ đồ</button>${due?'<button class="ok" data-a="start">Ôn tập tiếp</button>':''}</div></div>`;
}
function grade(ok){
  const c=Q.shift(),b=boxOf(c.n);
  if(ok){
    const nb=Math.min(7,b+1);
    c.n.s={b:nb,d:Date.now()+INT[nb]*DAY};done++;
  }else{
    const nb=c.lapsed?b:Math.max(0,b-DROP);
    c.n.s={b:nb,d:Date.now()};c.lapsed=1;Q.push(c);
  }
  shown=false;save();rvCard();
}
function rvClick(e){
  if(e.target.id==='rv')return rvClose();
  const a=e.target.closest('[data-a]');if(!a)return;
  const k=a.dataset.a;
  if(k==='close')rvClose();
  else if(k==='start')rvStart();
  else if(k==='show'){shown=true;rvCard()}
  else if(k==='yes')grade(true);
  else if(k==='no')grade(false);
}
rb.onclick=()=>{if(document.activeElement)document.activeElement.blur();rvHome()};
updBtn();
refresh();
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyCaB2aWazNU8Wqzi6cxUvVrpAn327nFW2Q",
  authDomain: "habit-app-0409nmt.firebaseapp.com",
  projectId: "habit-app-0409nmt",
  storageBucket: "habit-app-0409nmt.firebasestorage.app",
  messagingSenderId: "288401488015",
  appId: "1:288401488015:web:626d814942d677db8458fa"
});
const auth = getAuth(app), db = getFirestore(app);
const UPD = 'ru-grammar-updated';
let user = null, timer = null;
const stat = t => { document.getElementById('syncStat').textContent = t; };
const ref = () => doc(db, 'ngupham', user.uid);

const origSave = window.save;
window.save = function () {
  origSave();
  try { localStorage.setItem(UPD, Date.now()); } catch (e) {}
  if (user) { clearTimeout(timer); stat('Chờ lưu…'); timer = setTimeout(push, 1500); }
};

async function push() {
  try {
    await setDoc(ref(), { data: JSON.stringify(maps), updated: +localStorage.getItem(UPD) || Date.now() });
    stat('✓ Đã đồng bộ');
  } catch (e) { stat('Lỗi đồng bộ'); console.error(e); }
}

async function pull() {
  try {
    stat('Đang đồng bộ…');
    const s = await getDoc(ref());
    const local = +localStorage.getItem(UPD) || 0;
    if (s.exists() && s.data().updated > local) {
      maps = JSON.parse(s.data().data); cur = 0;
      origSave(); localStorage.setItem(UPD, s.data().updated);
      refresh(); stat('✓ Đã tải từ đám mây');
    } else { await push(); }
  } catch (e) { stat('Lỗi đồng bộ'); console.error(e); }
}

const btn = document.getElementById('login');
btn.onclick = () => user
  ? signOut(auth)
  : signInWithPopup(auth, new GoogleAuthProvider()).catch(e => alert('Lỗi đăng nhập: ' + e.code));
onAuthStateChanged(auth, u => {
  user = u;
  btn.textContent = u ? 'Đăng xuất (' + u.email + ')' : 'Đăng nhập Google';
  if (u) pull(); else stat('');
});
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(err => console.error('SW error:', err));
  });
}

</script>
